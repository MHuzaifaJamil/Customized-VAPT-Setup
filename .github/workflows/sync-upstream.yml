name: Sync fork with upstream

on:
  schedule:
    # Daily at 06:00 UTC. Adjust as you like — this only polls, it doesn't
    # cost anything when there's nothing new (upstream can't push to your
    # fork or trigger this directly; polling is the only option for a repo
    # you don't own).
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/Awarexone/Agentic-Bug-Hunter.git
  SYNC_BRANCH: sync/upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream main

      - name: Check for new upstream commits
        id: check
        run: |
          AHEAD=$(git rev-list --count main..upstream/main)
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "Upstream is $AHEAD commit(s) ahead of main."

      - name: Stop here if nothing new
        if: steps.check.outputs.ahead == '0'
        run: echo "Nothing to sync — exiting."

      - name: Reuse or create the sync branch
        if: steps.check.outputs.ahead != '0'
        run: |
          git checkout -B "$SYNC_BRANCH" main

      - name: Attempt merge
        if: steps.check.outputs.ahead != '0'
        id: merge
        run: |
          set +e
          git merge upstream/main --no-edit -m "sync: merge $(git rev-list --count main..upstream/main) commit(s) from Awarexone/Agentic-Bug-Hunter"
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            # Conflicts: commit the conflict-marker state as-is so the diff
            # is reviewable, rather than silently guessing a resolution.
            # Nothing here overwrites main until a human merges it in.
            git add -A
            git commit -m "sync: upstream merge with unresolved conflicts — needs manual resolution" --no-verify
            echo "clean=false" >> "$GITHUB_OUTPUT"
          else
            echo "clean=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fast-forward main directly (clean merge only)
        if: steps.check.outputs.ahead != '0' && steps.merge.outputs.clean == 'true'
        run: |
          git checkout main
          git merge --ff-only "$SYNC_BRANCH"
          git push origin main
          git push origin --delete "$SYNC_BRANCH" 2>/dev/null || true

      - name: Push sync branch (conflicts — needs a human)
        if: steps.check.outputs.ahead != '0' && steps.merge.outputs.clean == 'false'
        run: |
          git push origin "$SYNC_BRANCH" --force-with-lease

      - name: Open a PR, or fall back to an issue (conflicts only)
        if: steps.check.outputs.ahead != '0' && steps.merge.outputs.clean == 'false'
        env:
          # Prefer a SYNC_PAT repo secret (a personal access token with repo
          # scope) if one is ever added — the default GITHUB_TOKEN cannot
          # create pull requests in a forked repository even when "Allow
          # GitHub Actions to create and approve pull requests" is enabled;
          # that setting doesn't lift this specific fork restriction. Until
          # a PAT is added, this step falls back to opening/updating a
          # regular issue instead, which isn't restricted the same way, so
          # you're still notified either way.
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          COMPARE_URL="https://github.com/${{ github.repository }}/compare/main...$SYNC_BRANCH"
          BODY="Upstream (Awarexone/Agentic-Bug-Hunter) has new commits that don't merge cleanly onto your customized main.

          This branch (\`$SYNC_BRANCH\`) contains the merge attempt with unresolved conflict markers left in place — nothing has been guessed or auto-resolved. Review the diff, resolve conflicts, then merge.

          Upstream range: \`main..upstream/main\`
          Compare: $COMPARE_URL"

          EXISTING_PR=$(gh pr list --head "$SYNC_BRANCH" --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$EXISTING_PR" ]; then
            if gh pr edit "$EXISTING_PR" --body "$BODY" 2>/tmp/pr_err; then
              echo "Updated existing PR #$EXISTING_PR"
              exit 0
            fi
            cat /tmp/pr_err
          elif gh pr create --title "Sync with upstream (conflicts need review)" --body "$BODY" --base main --head "$SYNC_BRANCH" 2>/tmp/pr_err; then
            exit 0
          else
            cat /tmp/pr_err
          fi

          # PR path failed (most likely the fork-token restriction above) —
          # fall back to a plain issue so the sync is still visible.
          EXISTING_ISSUE=$(gh issue list --search "\"Sync with upstream (conflicts need review)\" in:title" --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --body "$BODY"
          else
            gh issue create --title "Sync with upstream (conflicts need review)" --body "$BODY"
          fi
