      - generic [ref=f5e49]:
        - generic [ref=f5e50]:
          - article [ref=f5e51]:
            - heading "Summary by iaramsri" [level=5] [ref=f5e52]
            - heading "Responsible Disclosure Report - NASA VDP" [level=1] [ref=f5e53]
            - heading "Unauthenticated XPATH Error-Based SQL Injection in NASA Space Place API" [level=2] [ref=f5e54]
            - heading "Executive Summary" [level=2] [ref=f5e55]
            - paragraph [ref=f5e56]:
              - text: On August 11, 2026, I identified and responsibly reported an
              - strong [ref=f5e57]: Unauthenticated error-based SQL injection vulnerability
              - text: "affecting a publicly accessible NASA Space Place API endpoint:"
            - code [ref=f5e60]: POST /api/experiment/answer/new/
            - paragraph [ref=f5e61]: The vulnerability was caused by the application's handling of HTTP form parameter names.
            - paragraph [ref=f5e62]:
              - text: User-controlled parameter names were incorporated into the SQL
              - code [ref=f5e63]: INSERT
              - text: column list without being sufficiently restricted to a predefined set of expected database fields.
            - paragraph [ref=f5e64]: By supplying a specially crafted parameter name, it was possible to modify the structure of the generated SQL statement and cause the underlying database server to evaluate attacker-controlled SQL expressions.
            - paragraph [ref=f5e65]:
              - text: The vulnerability was responsibly reported through the
              - strong [ref=f5e66]: NASA Vulnerability Disclosure Program (VDP) via Bugcrowd
              - text: .
            - paragraph [ref=f5e67]:
              - text: The submission was subsequently reviewed and remediated and was officially marked
              - strong [ref=f5e68]: Resolved on August 19, 2026
              - text: .
            - paragraph [ref=f5e69]:
              - text: "On"
              - strong [ref=f5e70]: August 20, 2026
              - text: ", NASA issued an official"
              - strong [ref=f5e71]: Letter of Recognition (LOR)
              - text: acknowledging the responsible security research and contribution.
            - paragraph [ref=f5e72]: Internal database identifiers, authentication tokens, full SQL injection payloads, and unnecessary implementation details have intentionally been omitted from this public disclosure.
            - separator [ref=f5e73]
            - heading "Affected Component" [level=2] [ref=f5e74]
            - paragraph [ref=f5e75]:
              - strong [ref=f5e76]: "Application:"
              - text: NASA Space Place
            - paragraph [ref=f5e77]:
              - strong [ref=f5e78]: "Affected endpoint:"
            - code [ref=f5e81]: POST /api/experiment/answer/new/
            - paragraph [ref=f5e82]:
              - strong [ref=f5e83]: "Authentication required:"
              - text: None
            - paragraph [ref=f5e84]: The endpoint formed part of the application's publicly accessible experiment-answer submission workflow.
            - separator [ref=f5e85]
            - heading "Vulnerability Details" [level=2] [ref=f5e86]
            - paragraph [ref=f5e87]:
              - text: The vulnerable endpoint dynamically constructed an SQL
              - code [ref=f5e88]: INSERT
              - text: statement using HTTP form parameter names as database column identifiers.
            - paragraph [ref=f5e89]: "Conceptually, the vulnerable behavior was similar to:"
            - code [ref=f5e92]: $sql = "INSERT INTO <table> (" . implode(",", array_keys($_POST)) . ") VALUES (...)";
            - paragraph [ref=f5e93]: When unexpected parameter names are accepted without strict validation, an attacker may be able to supply SQL syntax instead of a legitimate database column name.
            - paragraph [ref=f5e94]:
              - text: In this case, a specially crafted parameter name could modify the structure of the generated
              - code [ref=f5e95]: INSERT
              - text: statement and introduce attacker-controlled SQL expressions.
            - paragraph [ref=f5e96]:
              - text: This demonstrates an important SQL injection scenario where the vulnerable input exists in the
              - strong [ref=f5e97]: parameter name rather than the parameter value
              - text: .
            - separator [ref=f5e98]
            - heading "Proof of SQL Execution" [level=2] [ref=f5e99]
            - paragraph [ref=f5e100]: Controlled testing demonstrated that SQL expressions supplied through the crafted parameter name were parsed and evaluated by the underlying database server.
            - paragraph [ref=f5e101]: Error-based techniques were used to safely return a limited amount of fixed database metadata through attacker-controlled markers.
            - paragraph [ref=f5e102]: "For example, responses followed patterns similar to:"
            - code [ref=f5e105]: "XPATH syntax error: '~BD:[REDACTED]~'"
            - paragraph [ref=f5e106]: "and:"
            - code [ref=f5e109]: "XPATH syntax error: '~BU:[REDACTED]~'"
            - paragraph [ref=f5e110]: The markers surrounding the returned values were supplied by the testing request, while the values themselves were produced by database runtime functions.
            - paragraph [ref=f5e111]: A separate controlled database-object resolution test also confirmed that an application database column could be successfully referenced from an attacker-controlled subquery.
            - paragraph [ref=f5e112]: These tests demonstrated that the issue was not merely producing malformed SQL or a generic syntax error.
            - paragraph [ref=f5e113]:
              - text: The injected SQL expressions were being
              - strong [ref=f5e114]: evaluated by the database server
              - text: .
            - paragraph [ref=f5e115]: Specific database names, database account identifiers, schema details, and full injection payloads have been intentionally omitted.
            - separator [ref=f5e116]
            - heading "Potential Impact" [level=2] [ref=f5e117]
            - paragraph [ref=f5e118]:
              - text: Successful exploitation could allow an unauthenticated attacker to execute attacker-controlled SQL expressions and
              - code [ref=f5e119]: SELECT
              - text: subqueries under the privileges assigned to the application's database account.
            - paragraph [ref=f5e120]: "Depending on the permissions available to that account, potential consequences could include:"
            - list [ref=f5e121]:
              - listitem [ref=f5e122]: Unauthorized access to database information.
              - listitem [ref=f5e123]: Enumeration of database schema and application objects.
              - listitem [ref=f5e124]: Retrieval of application data accessible to the database account.
              - listitem [ref=f5e125]: Potential modification of application data where write permissions are available.
              - listitem [ref=f5e126]: Additional impact depending on the database configuration and assigned privileges.
            - paragraph [ref=f5e127]: Testing was intentionally stopped after confirming controlled SQL execution and limited metadata access.
            - paragraph [ref=f5e128]: The maximum possible impact against production data was not tested.
            - heading "Root Cause" [level=2] [ref=f5e129]
            - paragraph [ref=f5e130]:
              - text: The root cause was the use of
              - strong [ref=f5e131]: user-controlled HTTP parameter names as dynamically generated SQL identifiers
              - text: .
            - paragraph [ref=f5e132]: The application did not sufficiently restrict submitted parameter names to a fixed set of known fields before incorporating them into the SQL query structure.
            - paragraph [ref=f5e133]: This allowed a crafted parameter name to modify the intended SQL statement.
            - paragraph [ref=f5e134]: The vulnerability also demonstrates why traditional prepared statements are not sufficient when attacker-controlled input determines SQL identifiers.
            - paragraph [ref=f5e135]:
              - text: Parameterized queries protect SQL
              - strong [ref=f5e136]: values
              - text: ", but dynamically generated identifiers such as column names must instead be statically defined or validated against a strict allowlist."
            - separator [ref=f5e137]
            - heading "Remediation Recommendations" [level=2] [ref=f5e138]
            - paragraph [ref=f5e139]: The recommended remediation is to avoid dynamically constructing SQL column lists from submitted HTTP parameter names.
            - paragraph [ref=f5e140]: "The application should:"
            - list [ref=f5e141]:
              - listitem [ref=f5e142]: Define the accepted fields statically within the application.
              - listitem [ref=f5e143]: Strictly allowlist expected HTTP parameter names.
              - listitem [ref=f5e144]: Reject or ignore unexpected form parameters.
              - listitem [ref=f5e145]: Use prepared statements and bound parameters for all submitted values.
              - listitem [ref=f5e146]: Ensure client-controlled input cannot determine SQL identifiers.
              - listitem [ref=f5e147]: Generate server-controlled metadata such as timestamps and request information exclusively on the server.
              - listitem [ref=f5e148]: Avoid returning generated SQL statements to API clients.
              - listitem [ref=f5e149]: Suppress raw database error messages from public responses.
              - listitem [ref=f5e150]: Store detailed database errors only in protected server-side logs.
              - listitem [ref=f5e151]: Review similar create/update handlers for the same dynamic parameter-to-column pattern.
            - separator [ref=f5e152]
            - heading "Timeline" [level=2] [ref=f5e153]
            - list [ref=f5e154]:
              - listitem [ref=f5e155]:
                - strong [ref=f5e156]: August 11, 2026
                - text: — Vulnerability identified and reproduced through a fresh unauthenticated workflow.
              - listitem [ref=f5e157]:
                - strong [ref=f5e158]: August 12, 2026
                - text: — NASA acknowledged the report and referred it to the appropriate security and system teams.
              - listitem [ref=f5e159]:
                - strong [ref=f5e160]: August 12, 2026
                - text: — NASA confirmed that a Letter of Recognition would be awarded once the finding was resolved.
              - listitem [ref=f5e161]:
                - strong [ref=f5e162]: August 19, 2026
                - text: — Submission marked
                - strong [ref=f5e163]: Resolved
                - text: on Bugcrowd.
              - listitem [ref=f5e164]:
                - strong [ref=f5e165]: August 20, 2026
                - text: — NASA issued an official
                - strong [ref=f5e166]: Letter of Recognition (LOR)
                - text: .
            - separator [ref=f5e167]
            - heading "Resolution and Recognition" [level=2] [ref=f5e168]
            - paragraph [ref=f5e169]:
              - text: The vulnerability was responsibly disclosed through the
              - strong [ref=f5e170]: NASA Vulnerability Disclosure Program via Bugcrowd
              - text: .
            - paragraph [ref=f5e171]: "Following investigation and remediation, the submission was officially marked:"
            - paragraph [ref=f5e172]:
              - strong [ref=f5e173]: Resolved — August 19, 2026
            - paragraph [ref=f5e174]:
              - text: NASA subsequently issued a
              - strong [ref=f5e175]: Letter of Recognition on August 20, 2026
              - text: ", recognizing the responsible identification and reporting of the vulnerability."
            - paragraph [ref=f5e176]: The exact internal remediation implementation has not been publicly documented and is therefore not speculated upon in this disclosure.
            - separator [ref=f5e177]
            - heading "Ethical Statement" [level=2] [ref=f5e178]
            - paragraph [ref=f5e179]: This research was performed within the scope and requirements of NASA's Vulnerability Disclosure Program.
            - paragraph [ref=f5e180]: Testing was limited to what was necessary to demonstrate the vulnerability.
            - paragraph [ref=f5e181]: No production user records, credentials, personal information, or other sensitive application data were retrieved.
            - paragraph [ref=f5e182]: No destructive testing was performed.
            - paragraph [ref=f5e183]: Internal database identifiers, full exploitation payloads, tokens, and other unnecessary implementation details have been intentionally omitted from this public disclosure.
            - separator [ref=f5e184]
            - heading "Purpose of Disclosure" [level=2] [ref=f5e185]
            - paragraph [ref=f5e186]: "The goal of this disclosure is to highlight an unusual but important SQL injection pattern:"
            - paragraph [ref=f5e187]:
              - strong [ref=f5e188]: SQL injection through attacker-controlled HTTP parameter names rather than parameter values.
            - paragraph [ref=f5e189]: Applications may correctly parameterize submitted values while still remaining vulnerable if untrusted input is used to construct SQL identifiers or query structure.
            - paragraph [ref=f5e190]: "Secure database interaction therefore requires protection of both:"
            - list [ref=f5e191]:
              - listitem [ref=f5e192]:
                - strong [ref=f5e193]: SQL values
                - text: through parameterized queries.
              - listitem [ref=f5e194]:
                - strong [ref=f5e195]: SQL identifiers and structure
                - text: through static definitions and strict allowlisting.
            - paragraph [ref=f5e196]: This vulnerability was responsibly reported, investigated, remediated, and resolved through coordination between an independent security researcher, Bugcrowd, and NASA.
            - separator [ref=f5e197]
            - paragraph [ref=f5e198]:
              - strong [ref=f5e199]: "Researcher:"
              - code [ref=f5e200]: Itthidej Aramsri
              - strong [ref=f5e201]: "Program:"
              - code [ref=f5e202]: NASA - Vulnerability Disclosure Program via Bugcrowd
